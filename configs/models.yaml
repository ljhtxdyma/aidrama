# 模型下载清单（文件名/地址全部取自 ComfyUI 0.38 官方工作流模板，2026-10）
# 用法：python scripts/download_models.py --comfy D:/ComfyUI --groups core
# 国内网络：加 --source modelscope 或 --source hf-mirror（脚本会按顺序自动回退）
#
# 分组：
#   core      必装：H3 视频（含对白）、图像（可商用）、超分、配乐、补帧                 ≈ 135 GB
#   fast      预演加速：FastH3 8 步、H3 Turbo LoRA、Qwen Lightning                          ≈ 25 GB
#   lipsync   兜底口型：InfiniteTalk（Wan2.1 I2V 480p + 补丁 + 中文 wav2vec2）             ≈ 27 GB
#   animate   真人表演迁移：Wan Animate 2（蒸馏）                                           ≈ 23 GB
#   qwen21    Qwen Image 2.1（画质更强、16 张参考，但仅限非商用 Qwen Research License）    ≈ 34 GB
#   control   H3 Fun ControlNet（姿态/深度控制）+ SDPose                                    ≈ 4 GB
#
# license 字段仅供参考，商用前请阅读各模型原始许可证全文。


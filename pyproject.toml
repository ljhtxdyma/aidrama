[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aidrama"
version = "2026.10.0"
description = "本地 AI 短剧流水线：RTX 5090 + ComfyUI 0.38 + MiniMax H3 + IndexTTS-2.5"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "requests>=2.31",
  "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aidrama = "aidrama.cli:main"

[tool.setuptools]
packages = ["aidrama", "aidrama.graphs"]

[tool.setuptools.package-data]
aidrama = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["workflows", "docs"]

[tool.ruff.lint]
# 只开“真问题”类规则：未定义名、未使用的导入/变量、语法错误、可变默认参数
select = ["F", "E9", "B006", "B008"]
